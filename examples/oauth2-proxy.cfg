# Example only: replace origins and supply client/cookie secrets via environment.
# Configure a separate Casdoor application; explicitly authorize users with its tag.
provider = "oidc"
oidc_issuer_url = "https://id.example.com"
redirect_url = "https://app.example.com/oauth2/callback"
client_id = "REPLACE_WITH_APPLICATION_CLIENT_ID"
code_challenge_method = "S256"
email_domains = ["*"]
http_address = "0.0.0.0:4180"
upstreams = ["http://application:8080/"]
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "1h"
cookie_refresh = "1m"
pass_authorization_header = false
pass_access_token = false
set_xauthrequest = true
skip_provider_button = true
