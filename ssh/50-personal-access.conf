# Install only after an independent emergency connection is verified.
# Validate sshd -t, reload, and test a NEW certificate connection before tightening.
TrustedUserCAKeys /etc/ssh/personal-access/user_ca.pub
Match Group identity-managed
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    AuthorizedPrincipalsFile /etc/ssh/personal-access/principals/%u
Match all
