name: personal-access
services:
  casdoor:
    image: casbin/casdoor:4.20.0@sha256:afaafe1c58a3e33573a2c98d2ae0e3ad8ea1132a3abb68d50187c2fd922c380c
    restart: unless-stopped
    volumes:
      - ./runtime/casdoor/app.conf:/conf/app.conf:ro
      - ./runtime/casdoor/init.json:/conf/init.json:ro
      - ./runtime/casdoor/data:/data
    tmpfs: [/tmp, /logs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.7
    ports: ["127.0.0.1:18000:8000"]
    networks: [identity]
  step-ca:
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    restart: unless-stopped
    command: ["step-ca", "/home/step/config/ca.json", "--password-file", "/home/step/secrets/password"]
    volumes: ["./runtime/step:/home/step"]
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # The upstream binary carries this file capability; Linux refuses exec
    # when it is absent from the bounding set, even though we use port 9000.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.4
    ports: ["127.0.0.1:19000:9000"]
    networks: [identity]
    profiles: [ssh]
  nginx:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
    profiles: [edge]
    volumes:
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/tls:/etc/nginx/tls:ro
    ports: ["80:80", "443:443"]
    depends_on: [casdoor]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    networks: [identity]
  identity-gateway:
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
    profiles: [existing-edge]
    volumes:
      - ./runtime/nginx-internal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [casdoor]
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    networks: [identity, existing-edge]
networks:
  identity: {}
  existing-edge:
    external: true
    name: personal-access-edge
